openapi: 3.0.3

info:
  title: Pulse Monitor API
  description: >
    Pulse Monitor API is a RESTful uptime monitoring service that continuously
    checks websites, records time-series monitoring data, manages incidents,
    and exposes a public status page.

  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local Development
  - url: https://pulse-monitor-yd3n.onrender.com/
    description: Production

tags:
  - name: Health
  - name: Authentication
  - name: Monitors
  - name: Checks
  - name: Incidents
  - name: Status

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false

        message:
          type: string
          example: Validation failed

    RegisterRequest:
      type: object
      required:
        - email
        - password

      properties:
        email:
          type: string
          format: email
          example: love@example.com

        password:
          type: string
          example: password123

    LoginRequest:
      type: object
      required:
        - email
        - password

      properties:
        email:
          type: string
          format: email
          example: love@example.com

        password:
          type: string
          example: password123

    LoginResponse:
      type: object

      properties:
        success:
          type: boolean
          example: true

        data:
          type: string
          description: JWT Token

    Monitor:
      type: object

      properties:

        id:
          type: integer
          example: 1

        owner_id:
          type: integer
          example: 1

        name:
          type: string
          example: Google

        url:
          type: string
          example: https://google.com

        interval_seconds:
          type: integer
          example: 60

        expected_status:
          type: integer
          example: 200

        is_active:
          type: boolean
          example: true

        created_at:
          type: string
          format: date-time

        ok:
          type: boolean
          nullable: true
          example: true

        status_code:
          type: integer
          nullable: true
          example: 200

        checked_at:
          type: string
          format: date-time
          nullable: true

    CreateMonitor:
      type: object

      required:
        - name
        - url

      properties:

        name:
          type: string
          example: Google

        url:
          type: string
          example: https://google.com

        interval_seconds:
          type: integer
          example: 60

        expected_status:
          type: integer
          example: 200

    UpdateMonitor:
      type: object

      properties:

        name:
          type: string
          example: Google API

        url:
          type: string
          example: https://google.com

        interval_seconds:
          type: integer
          example: 30

        expected_status:
          type: integer
          example: 200

        is_active:
          type: boolean
          example: false

    Check:
      type: object

      properties:

        id:
          type: integer
          example: 1

        monitor_id:
          type: integer
          example: 1

        checked_at:
          type: string
          format: date-time

        ok:
          type: boolean
          example: true

        status_code:
          type: integer
          example: 200

        latency_ms:
          type: integer
          example: 84

        error:
          type: string
          nullable: true

    Incident:
      type: object

      properties:

        id:
          type: integer
          example: 1

        monitor_id:
          type: integer
          example: 1

        started_at:
          type: string
          format: date-time

        resolved_at:
          type: string
          nullable: true
          format: date-time

        cause:
          type: string
          example: Connection timeout

    Uptime:
      type: object

      properties:

        uptime_percent:
          type: number
          example: 99.82

        average_latency:
          type: number
          example: 84

        p95_latency:
          type: number
          example: 145
paths:

  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns the health status of the API.
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"

      responses:
        "201":
          description: User successfully registered

        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"

      responses:
        "200":
          description: Login successful

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /monitors:
    get:
      tags:
        - Monitors
      summary: List all monitors
      security:
        - bearerAuth: []

      responses:
        "200":
          description: List of monitors
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Monitor"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - Monitors
      summary: Create a monitor
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMonitor"

      responses:
        "201":
          description: Monitor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Monitor"

        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /monitors/{id}:
    get:
      tags:
        - Monitors
      summary: Get a monitor
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Monitor found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  data:
                    $ref: "#/components/schemas/Monitor"

        "401":
          description: Unauthorized

        "404":
          description: Monitor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      tags:
        - Monitors
      summary: Update a monitor
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMonitor"

      responses:
        "200":
          description: Monitor updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Monitor"

        "400":
          description: Validation failed

        "401":
          description: Unauthorized

        "404":
          description: Monitor not found

    delete:
      tags:
        - Monitors
      summary: Delete a monitor
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "204":
          description: Monitor deleted

        "401":
          description: Unauthorized

        "404":
          description: Monitor not found
  /monitors/{id}/checks:
    get:
      tags:
        - Checks
      summary: List monitor checks
      description: Returns a keyset-paginated list of monitoring checks.
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

        - name: after
          in: query
          required: false
          schema:
            type: integer
          description: Cursor for keyset pagination

        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20

      responses:
        "200":
          description: Checks retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Check"

                  nextCursor:
                    type: integer
                    nullable: true
                    example: 35

        "401":
          description: Unauthorized

        "404":
          description: Monitor not found

  /monitors/{id}/checks.csv:
    get:
      tags:
        - Checks
      summary: Download monitor checks as CSV
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: CSV downloaded successfully
          content:
            text/csv:
              schema:
                type: string

        "401":
          description: Unauthorized

        "404":
          description: Monitor not found

  /monitors/{id}/uptime:
    get:
      tags:
        - Checks
      summary: Monitor uptime statistics
      description: Returns uptime percentage, average latency and p95 latency.
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

        - name: window
          in: query
          required: false
          schema:
            type: integer
            default: 24
          description: Time window in hours

      responses:
        "200":
          description: Uptime statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  data:
                    $ref: "#/components/schemas/Uptime"

        "401":
          description: Unauthorized

        "404":
          description: Monitor not found
  /incidents:
    get:
      tags:
        - Incidents
      summary: List all incidents
      description: Returns all incidents belonging to the authenticated user.
      security:
        - bearerAuth: []

      responses:
        "200":
          description: Incident list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"

        "401":
          description: Unauthorized

  /monitors/{id}/incidents:
    get:
      tags:
        - Incidents
      summary: List incidents for a monitor
      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Incident history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"

        "401":
          description: Unauthorized

        "404":
          description: Monitor not found

  /status:
    get:
      tags:
        - Status
      summary: Public status page
      description: >
        Returns the current state of every active monitor together with
        any open incidents. This endpoint is public and does not require
        authentication.

      responses:
        "200":
          description: Public system status
          content:
            application/json:
              schema:
                type: object
                properties:

                  generated_at:
                    type: string
                    format: date-time

                  monitors:
                    type: array
                    items:
                      $ref: "#/components/schemas/Monitor"

                  open_incidents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"
services:
  postgres:
    image: postgres:17-alpine
    container_name: pulse-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: pulse_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulse_monitor"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .

    container_name: pulse-api

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/pulse_monitor
      JWT_SECRET: change-me
      LOG_LEVEL: info
      POLL_TIMEOUT_MS: 5000

volumes:
  postgres-data:
name: CI

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: pulse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pulse_test
      JWT_SECRET: github-actions-secret
      PORT: 3001
      LOG_LEVEL: info
      POLL_TIMEOUT_MS: 5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Create .env.test
        run: |
          cat <<EOF > .env.test
          NODE_ENV=$NODE_ENV
          DATABASE_URL=$DATABASE_URL
          JWT_SECRET=$JWT_SECRET
          PORT=$PORT
          LOG_LEVEL=$LOG_LEVEL
          POLL_TIMEOUT_MS=$POLL_TIMEOUT_MS
          EOF

      - run: npm run migrate:test

      - run: npm test

      - run: npm run lint
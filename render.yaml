services:
  - type: web
    name: pulse-uptime-api
    runtime: node

    plan: free

    buildCommand: npm ci
    startCommand: npm start

    autoDeploy: true

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: JWT_SECRET
        sync: false